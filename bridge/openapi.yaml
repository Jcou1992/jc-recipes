openapi: 3.1.0
info:
  title: Tanebi Recipe Bridge
  version: 1.0.0
  description: Structures are produced by the GPT; this API saves recipe batches to SEKAI App and Tanebi Inbox.
servers:
  - url: https://tanebi-recipe-bridge.jcou.workers.dev
paths:
  /v1/recipe-captures:
    post:
      operationId: captureRecipes
      summary: Save one or more structured recipes to SEKAI and Google Drive
      description: Performs idempotent dual-write orchestration for a batch of recipes.
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
      responses:
        '200':
          description: Per-recipe orchestration result, including partial failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResponse'
        '400':
          description: Invalid payload
        '401':
          description: Invalid or missing API key
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Source:
      type: object
      additionalProperties: false
      required: [type, language]
      properties:
        type:
          type: string
          enum: [text, dictation, photo, conversation, combined, unknown]
        language:
          type: string
          default: es-MX
        originalText:
          type: [string, 'null']
          maxLength: 100000
        notes:
          type: [string, 'null']
          maxLength: 5000
    Ingredient:
      type: object
      additionalProperties: false
      required: [amount, unit, name]
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 1000000
        unit:
          type: [string, 'null']
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 200
    Step:
      type: object
      additionalProperties: false
      required: [order, content, timer_seconds]
      properties:
        order:
          type: integer
          minimum: 1
        content:
          type: string
          minLength: 1
          maxLength: 2000
        timer_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 86400
    Recipe:
      type: object
      additionalProperties: false
      required: [name, servings, ingredients, steps]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        servings:
          type: integer
          minimum: 1
          maximum: 999
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Ingredient'
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Step'
        description:
          type: [string, 'null']
          maxLength: 5000
        prep_time:
          type: [integer, 'null']
          minimum: 0
          maximum: 1440
        cook_time:
          type: [integer, 'null']
          minimum: 0
          maximum: 1440
        serving_size_label:
          type: [string, 'null']
          maxLength: 40
        tags:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            maxLength: 32
        notes:
          type: [string, 'null']
          maxLength: 5000
    CaptureOptions:
      type: object
      additionalProperties: false
      properties:
        saveToSekai:
          type: boolean
          default: true
        saveToDrive:
          type: boolean
          default: true
        duplicatePolicy:
          type: string
          enum: [reuse, version, error]
          default: version
    CaptureRequest:
      type: object
      additionalProperties: false
      required: [source, recipes]
      properties:
        captureId:
          type: [string, 'null']
          maxLength: 100
        source:
          $ref: '#/components/schemas/Source'
        recipes:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Recipe'
        options:
          $ref: '#/components/schemas/CaptureOptions'
    DestinationResult:
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [created, reused, skipped, failed]
        id:
          type: [string, 'null']
        name:
          type: [string, 'null']
        url:
          type: [string, 'null']
        error:
          type: [string, 'null']
    RecipeResult:
      type: object
      additionalProperties: false
      required: [requestedName, finalName, fingerprint, status, sekai, drive]
      properties:
        requestedName:
          type: string
        finalName:
          type: string
        fingerprint:
          type: string
        status:
          type: string
          enum: [complete, partial, failed]
        sekai:
          $ref: '#/components/schemas/DestinationResult'
        drive:
          $ref: '#/components/schemas/DestinationResult'
        warnings:
          type: array
          items:
            type: string
    CaptureResponse:
      type: object
      additionalProperties: false
      required: [ok, status, captureId, results]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [complete, partial, failed]
        captureId:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecipeResult'
