name: test-gate

on:
  pull_request:
    paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - 'scripts/test-gate.mjs'
      - '.test-gate/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compute changed test files vs base branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # SHAs come in via env (data, not code) to avoid any chance of
          # expression-injection at YAML compile time.
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$' || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run test gate
        if: steps.diff.outputs.changed != ''
        env:
          GATE_COMMIT_MSG: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
        run: |
          # Pass changed files via env to avoid shell-injection from PR-controlled
          # filenames. Heuristic-only gating (no Claude escalation in CI).
          # shellcheck disable=SC2086
          node scripts/test-gate.mjs $CHANGED_FILES

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-gate-report
          path: .test-gate/last-report.md
          if-no-files-found: ignore

      - name: Post report as PR comment
        if: always() && steps.diff.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.test-gate/last-report.md')) return;
            const body = fs.readFileSync('.test-gate/last-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### 🧪 Test Gate\n\n' + body,
            });
